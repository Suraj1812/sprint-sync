[project]
name = "sprint-sync-backend"
version = "0.1.0"
description = "Enterprise-grade SprintSync backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "redis==5.2.1",
    "celery==5.4.0",
    "argon2-cffi==23.1.0",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "structlog==24.4.0",
    "orjson==3.10.12",
    "email-validator==2.2.0",
    "slowapi==0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "mypy==1.14.1",
    "pre-commit==4.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
