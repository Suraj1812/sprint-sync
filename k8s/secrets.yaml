apiVersion: v1
kind: Secret
metadata:
  name: sprintsync-api-secrets
  namespace: sprintsync
type: Opaque
stringData:
  # Replace with real values, managed by a secrets operator or KMS.
  SECRET_KEY: "replace-with-production-secret-at-least-32-characters"
  POSTGRES_PASSWORD: "replace-with-strong-password"
  SMTP_PASSWORD: "replace-with-smtp-password"
