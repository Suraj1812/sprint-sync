apiVersion: apps/v1
kind: Deployment
metadata:
  name: sprintsync-api
  namespace: sprintsync
  labels:
    app: sprintsync-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sprintsync-api
  template:
    metadata:
      labels:
        app: sprintsync-api
    spec:
      containers:
        - name: api
          image: sprintsync/api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: sprintsync-api-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sprintsync-api-secrets
                  key: SECRET_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sprintsync-api-secrets
                  key: POSTGRES_PASSWORD
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sprintsync-api-secrets
                  key: SMTP_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sprintsync-api
  namespace: sprintsync
spec:
  selector:
    app: sprintsync-api
  ports:
    - port: 80
      targetPort: 8000
