apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sprintsync-api-hpa
  namespace: sprintsync
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sprintsync-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sprintsync-web-hpa
  namespace: sprintsync
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sprintsync-web
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
